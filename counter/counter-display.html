<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Counter Live — EcoSystem (Counter)</title>
  <link rel="stylesheet" href="../css/global.css" />
  <style>
    :root {
      --bg: var(--waitless-bg);
      --surface: var(--waitless-surface);
      --surface-2: var(--waitless-surface-soft);
      --text: var(--waitless-text);
      --muted: var(--waitless-muted);
      --line: var(--waitless-line);
      --accent: var(--waitless-primary);
      --accent-hover: var(--waitless-primary-hover);
      --accent-2: var(--waitless-success);
      --warn: var(--waitless-danger);
      --shadow: var(--waitless-shadow);
      --shadow-lg: var(--waitless-shadow-lg);
      --radius: var(--waitless-radius);
      --radius-sm: var(--waitless-radius-sm);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg) !important;
      color: var(--text) !important;
      padding: 24px;
      min-height: 100vh;
    }
    .panel {
      max-width: 1400px;
      margin: 0 auto;
      background: var(--surface) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 30px !important;
      border: 1px solid var(--line) !important;
      border-radius: var(--radius) !important;
      box-shadow: var(--shadow) !important;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    .title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .subtitle {
      margin-top: 6px;
      color: var(--muted) !important;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .row {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 24px;
      flex-wrap: wrap;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      backdrop-filter: blur(10px);
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 240px;
    }
    .field label, .row > label {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--muted) !important;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    select, input {
      padding: 12px 16px !important;
      border: 1px solid var(--line) !important;
      border-radius: var(--radius-sm) !important;
      font-size: 0.95rem !important;
      background: var(--waitless-input-bg) !important;
      color: var(--text) !important;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    select:focus, input:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15) !important;
    }
    .tokens {
      display: grid;
      gap: 20px;
      margin-top: 14px;
    }
    .token {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 20px;
      align-items: stretch;
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
      animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .token::before {
      content: '';
      position: absolute;
      left: 0;
      top: 24px;
      bottom: 24px;
      width: 4px;
      background: var(--accent);
      border-radius: 0 4px 4px 0;
    }
    .token .actions {
      display: flex;
      flex-direction: column;
      gap: 14px;
      justify-content: flex-start;
    }
    .token .actions button {
      width: 100%;
      min-height: 64px;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: var(--radius-sm) !important;
      border: 0;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      touch-action: manipulation;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }
    .btn-serve {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
      color: #fff !important;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.25) !important;
    }
    .btn-serve:hover {
      background: linear-gradient(135deg, #34d399 0%, #059669 100%) !important;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35) !important;
    }
    .btn-serve:active {
      transform: translateY(0.5px);
    }
    .btn-noshow {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%) !important;
      color: #fff !important;
      box-shadow: 0 6px 20px rgba(244, 63, 94, 0.25) !important;
    }
    .btn-noshow:hover {
      background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%) !important;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(244, 63, 94, 0.35) !important;
    }
    .btn-noshow:active {
      transform: translateY(0.5px);
    }
    .muted {
      color: var(--muted) !important;
      font-size: 0.9rem;
    }
    .status-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin: 12px 0 16px;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', sans-serif;
      box-shadow: var(--shadow-sm);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }
    .token-stage {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      min-height: 100%;
    }
    .token-hero {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 6px 6px 0;
    }
    .token-number {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      font-size: 7.5rem;
      font-weight: 900;
      line-height: 1;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text);
      text-align: center;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02), var(--shadow-sm);
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
    }
    [data-theme="dark"] .token-number {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      text-shadow: 0 0 20px rgba(129, 140, 248, 0.15);
    }
    .token-empty {
      padding: 48px;
      text-align: center;
      font-size: 1.1rem;
      color: var(--muted);
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .token-meta {
      display: flex;
      gap: 8px;
      justify-content: flex-start;
      flex-wrap: wrap;
      color: var(--muted);
    }
    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 99px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .meta-pill strong {
      color: var(--accent);
      font-weight: 800;
    }
    .customer-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 99px;
      background: rgba(79, 70, 229, 0.08);
      border: 1px solid rgba(79, 70, 229, 0.15);
      color: var(--accent);
      font-weight: 800;
      font-size: 0.95rem;
    }
    [data-theme="dark"] .customer-name {
      background: rgba(129, 140, 248, 0.15);
      border-color: rgba(129, 140, 248, 0.3);
      color: #cbd5e1;
    }
    .customer-name small {
      font-weight: 700;
      color: var(--muted) !important;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
    }
    .actions-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }
    .actions-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 800;
    }
    .recall-rail {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .recall-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text);
    }
    .recall-note {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }
    .ghost {
      background: var(--surface) !important;
      border: 1px solid var(--line) !important;
      color: var(--text) !important;
      padding: 10px 18px !important;
      border-radius: var(--radius-sm) !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
      touch-action: manipulation;
      position: relative;
      z-index: 1;
      font-weight: 700 !important;
    }
    .ghost:hover {
      transform: translateY(-1.5px) !important;
      border-color: var(--accent) !important;
      box-shadow: var(--shadow-sm) !important;
      color: var(--accent) !important;
      background: var(--surface-2) !important;
    }
    .ghost:active {
      transform: translateY(0.5px) !important;
    }
    .controls {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .big-select {
      min-width: 240px;
    }
    .workspace-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: start;
      min-height: calc(100vh - 280px);
    }
    @media (min-width: 1024px) {
      .workspace-grid {
        grid-template-columns: 1.2fr 1fr;
      }
    }
    .portrait-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .portrait-panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .portrait-panel:hover {
      border-color: rgba(79, 70, 229, 0.15);
      box-shadow: var(--shadow-lg);
    }
    .portrait-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    }
    .portrait-panel-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text);
    }
    .portrait-panel-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
      margin-top: 3px;
    }
    .portrait-panel-body {
      padding: 20px;
      flex: 1 1 auto;
      overflow: auto;
      max-height: calc(100vh - 300px);
    }
    .search-wrap {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }
    .search-wrap input {
      width: 100%;
      min-width: 0;
    }
    .search-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: 99px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--muted);
      font-weight: 800;
      font-size: 0.8rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .state-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 6px;
    }
    .state-panel {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
    }
    .state-panel:hover {
      border-color: rgba(79, 70, 229, 0.1);
      box-shadow: var(--shadow);
    }
    .state-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-2);
    }
    .state-panel-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text);
    }
    .state-panel-subtitle {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
    }
    .state-panel-body {
      padding: 14px;
      flex: 1 1 auto;
      overflow: auto;
      max-height: 280px;
    }
    .token-list {
      display: grid;
      gap: 10px;
    }
    .token-list-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .token-list-item:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-sm);
    }
    .token-list-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--text);
    }
    .token-list-meta {
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .token-list-meta span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .token-list-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .mini-btn {
      padding: 8px 14px !important;
      border-radius: var(--radius-sm) !important;
      border: 0 !important;
      cursor: pointer !important;
      font-weight: 800 !important;
      font-size: 0.85rem !important;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .mini-btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%) !important;
      color: #fff !important;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15) !important;
    }
    .mini-btn-primary:hover {
      transform: translateY(-1px) !important;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25) !important;
    }
    .mini-btn-primary:active {
      transform: translateY(0.5px) !important;
    }
    .mini-btn-ghost {
      background: var(--surface-2) !important;
      color: var(--text) !important;
      border: 1px solid var(--line) !important;
    }
    .mini-btn-ghost:hover {
      border-color: var(--accent) !important;
      color: var(--accent) !important;
      transform: translateY(-1px) !important;
    }
    .empty-state {
      padding: 24px;
      border: 2px dashed var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--muted);
      text-align: center;
      font-size: 0.95rem;
    }
    @media (max-width: 980px) {
      .token {
        grid-template-columns: 1fr;
      }
      .actions-panel {
        order: 2;
      }
      .token-list-item {
        grid-template-columns: 1fr;
      }
      .token-list-actions {
        justify-content: flex-start;
      }
    }
    @media (max-width: 700px) {
      body {
        padding: 12px;
      }
      .panel {
        padding: 16px !important;
        border-radius: var(--radius-sm) !important;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      .row {
        padding: 14px;
      }
      .field, .big-select {
        width: 100%;
        min-width: 0;
      }
      .token-number {
        min-height: 150px;
        font-size: 5rem;
      }
      .token .actions button {
        min-height: 56px;
        font-size: 1rem;
      }
      .controls {
        width: 100%;
        justify-content: space-between;
      }
    }
    @media (min-width: 980px) and (max-height: 760px) {
      .token-number {
        min-height: 160px;
        font-size: 6rem;
      }
      .actions-panel {
        padding: 16px;
      }
    }
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.4);
      z-index: 9999;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal[aria-hidden="false"] {
      display: flex;
    }
    .modal-content {
      background: var(--surface);
      padding: 28px;
      border-radius: var(--radius);
      min-width: 340px;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--line);
      animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes scaleIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-content h3 {
      margin: 0 0 16px 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .modal-content label {
      display: block;
      margin-top: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .modal-content input {
      width: 100%;
      margin-top: 6px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-weight: 800;
      cursor: pointer;
      border: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    #sign-in-submit {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
    }
    #sign-in-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.3);
    }
    #sign-in-cancel {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--line);
    }
    #sign-in-cancel:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .msg {
      margin-top: 12px;
      color: var(--warn);
      font-size: 0.9rem;
      min-height: 20px;
      font-weight: 600;
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 14px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 99px;
      box-shadow: var(--shadow-sm);
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      text-transform: uppercase;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .wl-topbar.waitless-global-topbar {
      display: none !important;
    }
    body.waitless-index-ui {
      padding-top: 24px !important;
    }
  </style>
</head>
<body>
  <div class="panel active">
    <div class="status-bar" style="justify-content: space-between; align-items: center; width: 100%;">
      <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
        <span id="status-badge" class="status-chip"><span class="status-dot"></span><span id="status">Not connected</span></span>
        <span class="status-chip">Recall ready</span>
        <span class="status-chip">Customer name aware</span>
      </div>
      <div class="controls">
        <div id="user-profile-badge" class="user-profile" style="display:none">
          <div class="user-avatar" id="user-avatar-char">U</div>
          <div style="text-align:left">
            <div class="muted small" style="font-size:0.75rem;line-height:1;margin-bottom:2px;">Operator</div>
            <div id="auth-user" class="small" style="font-weight:700;">Not signed in</div>
          </div>
        </div>
        <button id="org-logout" class="ghost" type="button" style="display:none">Sign Out</button>
        <button id="sign-in-btn" class="ghost" type="button">Sign In</button>
      </div>
    </div>

    <div id="selection-row" class="row">
      <div class="field">
        <label for="org-select">Organization</label>
        <select id="org-select" class="big-select" disabled><option value="">-- Sign in first --</option></select>
      </div>

      <div class="field">
        <label for="counter-select">Counter</label>
        <select id="counter-select" class="big-select" disabled><option value="">-- Select counter --</option></select>
      </div>

      <button id="refresh-orgs" class="ghost" type="button" disabled>Refresh</button>
    </div>

    <div class="workspace-grid">
      <div id="tokens" class="tokens portrait-layout"></div>
    </div>
  </div>

  <!-- Sign-in Modal -->
  <div id="sign-in-modal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="sign-in-title">
      <h3 id="sign-in-title">Operator Sign In</h3>
      <form id="sign-in-form">
        <label for="sign-email">Email</label>
        <input id="sign-email" type="email" required />
        <label for="sign-password">Password</label>
        <input id="sign-password" type="password" required />
        <div class="modal-actions">
          <button type="submit" id="sign-in-submit">Sign in</button>
          <button type="button" id="sign-in-cancel">Cancel</button>
        </div>
        <div id="sign-in-msg" class="msg"></div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="../js/config/firebase-config.js"></script>
  <script src="counter-display.js"></script>
</body>
</html>
